name: PUB legacy22 simple shape probe

on:
  push:
    branches:
      - research/legacy22-noquill-corpus-probe-20260929
    paths:
      - .github/workflows/pub-legacy22-simple-shape-probe.yml

permissions:
  contents: write

env:
  RAR_REF: aa2df26384fe6fe29e88dcd0ee9fdda908d4c82a
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar-target

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HeisLuka/rar
          ref: ${{ env.RAR_REF }}
          path: rar-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Install CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47
      - name: Patch bounded marker set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("rar-src/vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs")
          s=p.read_text()
          s=s.replace(
              "const LEGACY_TEXT_SHAPE_TYPE: u16 = 0x0008;",
              "const LEGACY_TEXT_SHAPE_TYPE: u16 = 0x0000;",
          )
          s=s.replace(
              "if child_entry.chunk_type != LEGACY_TEXT_SHAPE_TYPE {",
              "if !matches!(child_entry.chunk_type, LEGACY_TEXT_SHAPE_TYPE | 0x0004 | 0x0005 | 0x0006 | 0x0007) {",
          )
          s=s.replace(
              "let story_id = story_by_owner.get(&child_object_id).copied();",
              "let story_id = if child_entry.chunk_type == LEGACY_TEXT_SHAPE_TYPE { story_by_owner.get(&child_object_id).copied() } else { None };",
          )
          p.write_text(s)
          PY
      - name: Build Reader
        run: cargo build --manifest-path rar-src/vendor/producer-a/Cargo.toml -p pub-viewer --release --bin corpus-reader-receipt
      - name: Replay corpus
        run: |
          rm -rf pub-corpus/data/legacy22-simple-shape-profile
          python pub-corpus/scripts/deep_profile.py --corpus-root pub-corpus --rar-tools rar-src/tools/corpus --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" --rar-ref "${RAR_REF}+simple-shapes" --out pub-corpus/data/legacy22-simple-shape-profile --workers 4
      - name: Compare
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          before=json.loads(Path("pub-corpus/data/legacy22-p97-text-marker-profile/reader-records.json").read_text())
          after=json.loads(Path("pub-corpus/data/legacy22-simple-shape-profile/reader-records.json").read_text())
          bl=[r for r in before if r.get("contents_family")=="0x22" and r.get("opened")]
          al=[r for r in after if r.get("contents_family")=="0x22" and r.get("opened")]
          result={
              "old_open_before":len(bl),
              "old_open_after":len(al),
              "files_with_scene_nodes_before":sum((r.get("scene_node_count") or 0)>0 for r in bl),
              "files_with_scene_nodes_after":sum((r.get("scene_node_count") or 0)>0 for r in al),
              "scene_node_total_before":sum(r.get("scene_node_count") or 0 for r in bl),
              "scene_node_total_after":sum(r.get("scene_node_count") or 0 for r in al),
              "story_frame_total_before":sum(r.get("story_frame_count") or 0 for r in bl),
              "story_frame_total_after":sum(r.get("story_frame_count") or 0 for r in al),
              "text_fragment_total_before":sum(r.get("text_fragment_count") or 0 for r in bl),
              "text_fragment_total_after":sum(r.get("text_fragment_count") or 0 for r in al),
              "mature_open_before":sum(r.get("opened") is True for r in before if r.get("contents_family")=="0x2c"),
              "mature_open_after":sum(r.get("opened") is True for r in after if r.get("contents_family")=="0x2c"),
          }
          Path("pub-corpus/data/legacy22-simple-shape-profile/delta.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
      - name: Publish
        shell: bash
        run: |
          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add pub-corpus/data/legacy22-simple-shape-profile
          git commit -m "lab: probe simple legacy22 shapes"
          git push origin HEAD:"${GITHUB_REF_NAME}"
