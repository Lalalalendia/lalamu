name: Android release security audit

on:
  pull_request:
    paths:
      - ".github/workflows/android-release-security-audit.yml"
      - "tools/android_release_security.py"
      - "tests/test_android_release_security.py"
      - "research/mobile-security/**"
  push:
    paths:
      - ".github/workflows/android-release-security-audit.yml"
      - "tools/android_release_security.py"
      - "tests/test_android_release_security.py"
      - "research/mobile-security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run security-gate unit tests
        run: python3 -m unittest tests/test_android_release_security.py

  chaptera-reader-baseline:
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.10.2"

      - name: Fetch pinned Chaptera Reader source
        run: |
          git init target
          git -C target remote add origin https://github.com/HeisLuka/rar.git
          git -C target fetch --depth 1 origin 318f82a680de44ddcde201a447e8354c46803122
          git -C target checkout --detach FETCH_HEAD
          test "$(git -C target rev-parse HEAD)" = "318f82a680de44ddcde201a447e8354c46803122"

      - name: Scan mobile source for high-confidence embedded secrets
        run: |
          mkdir -p out
          python3 tools/android_release_security.py scan             --path target/apps/chaptera-mobile-android             --fail-on high             --report out/source-app.json
          python3 tools/android_release_security.py scan             --path target/crates/chaptera-mobile-reader-core             --fail-on high             --report out/source-core.json
          python3 tools/android_release_security.py scan             --path target/crates/chaptera-mobile-reader-jni             --fail-on high             --report out/source-jni.json

      - name: Validate or generate Gradle dependency verification metadata
        run: |
          META=target/apps/chaptera-mobile-android/gradle/verification-metadata.xml
          if test -f "$META"; then
            python3 tools/android_release_security.py gradle-metadata --file "$META"
            gradle -p target/apps/chaptera-mobile-android               --no-daemon               --dependency-verification=strict               :app:dependencies
          else
            echo "Upstream has no committed Gradle verification metadata; generating a candidate receipt."
            gradle -p target/apps/chaptera-mobile-android               --no-daemon               --write-verification-metadata sha256               :app:dependencies
            python3 tools/android_release_security.py gradle-metadata --file "$META"
          fi
          cp "$META" out/verification-metadata.xml

      - name: Build representative release APK payload for embedded-secret scan
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          rustup target add aarch64-linux-android --toolchain 1.94.1
          cargo +1.94.1 install cargo-ndk --version 4.1.2 --locked
          rm -rf target/apps/chaptera-mobile-android/app/src/main/jniLibs
          cargo +1.94.1 ndk             -t arm64-v8a             -o "$GITHUB_WORKSPACE/target/apps/chaptera-mobile-android/app/src/main/jniLibs"             build             --manifest-path target/crates/chaptera-mobile-reader-jni/Cargo.toml             --release
          gradle -p target/apps/chaptera-mobile-android --no-daemon :app:assembleRelease
          APK=target/apps/chaptera-mobile-android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          python3 tools/android_release_security.py scan             --path "$APK"             --apk             --fail-on high             --report out/release-apk-secrets.json
          sha256sum "$APK" | tee out/release-apk.sha256

      - name: Record signer gate state
        run: |
          APK=target/apps/chaptera-mobile-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if command -v apksigner >/dev/null 2>&1 && apksigner verify "$APK"; then
            echo "Unexpected: baseline release APK is signed." | tee out/signer-state.txt
          else
            echo "Expected baseline gap: release APK is unsigned; production signer gate remains blocked on signing input." | tee out/signer-state.txt
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-release-security-baseline
          path: out/
          if-no-files-found: error
