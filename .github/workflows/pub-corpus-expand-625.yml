name: PUB corpus expand to 625

on:
  workflow_dispatch:
  push:
    branches:
      - research/pub-corpus-expand-625-20260929
    paths:
      - "pub-corpus/scripts/materialize_rar_container_delta.py"
      - ".github/workflows/pub-corpus-expand-625.yml"

permissions:
  contents: write

concurrency:
  group: pub-corpus-expand-625-${{ github.ref }}
  cancel-in-progress: true

env:
  RAR_REF: 8751688f1509397f4d2c591e6f7b12d6a9fed4a5

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout working corpus
        uses: actions/checkout@v4

      - name: Checkout pinned Rar corpus authority
        uses: actions/checkout@v4
        with:
          repository: HeisLuka/rar
          ref: ${{ env.RAR_REF }}
          path: rar-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CFB/archive tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check olefile==0.47
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Materialize exact-authority container tranche
        run: |
          set -euo pipefail
          python -m py_compile pub-corpus/scripts/materialize_rar_container_delta.py
          rm -rf pub-corpus/data/rar-container-materialize
          python pub-corpus/scripts/materialize_rar_container_delta.py \
            --corpus-root pub-corpus \
            --rar-tools rar-src/tools/corpus \
            --out pub-corpus/data/rar-container-materialize \
            --target-minimum 625 \
            --root-order 1,2,3,0,4

      - name: Verify strict corpus floor and receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          import olefile

          root = Path("pub-corpus/corpus/native/unclassified")
          paths = sorted(root.glob("*.pub"))
          assert len(paths) >= 625, len(paths)
          seen=set()
          for path in paths:
              data=path.read_bytes()
              sha=hashlib.sha256(data).hexdigest()
              assert sha == path.stem.lower(), path
              assert sha not in seen, sha
              seen.add(sha)
              assert data[:8] == bytes.fromhex("d0cf11e0a1b11ae1"), path
              with olefile.OleFileIO(data) as ole:
                  streams={"/"+"/".join(x) for x in ole.listdir(streams=True, storages=False)}
                  assert "/Contents" in streams, path
          s=json.loads(Path("pub-corpus/data/rar-container-materialize/latest.json").read_text())
          assert s["target_met"] is True, s
          assert s["strict_unique_after"] == len(paths), (s, len(paths))
          assert s["new_strict_unique"] >= 226, s
          print(json.dumps(s, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pub-corpus-expand-625-${{ github.run_id }}
          path: pub-corpus/data/rar-container-materialize/**
          if-no-files-found: error
          retention-days: 30

      - name: Commit materialized corpus and provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- pub-corpus/corpus/native/unclassified pub-corpus/data/rar-container-materialize)" ]]; then
            echo "No corpus changes."
            exit 0
          fi
          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add -- pub-corpus/corpus/native/unclassified pub-corpus/data/rar-container-materialize
          git commit -m "lab: expand strict PUB working corpus to 625"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase "origin/${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
