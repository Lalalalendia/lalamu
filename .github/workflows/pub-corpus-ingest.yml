name: PUB corpus ingest

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pub-corpus/data/candidates.json"
      - "pub-corpus/scripts/ingest_candidates.py"
      - ".github/workflows/pub-corpus-ingest.yml"
  schedule:
    - cron: "17 3 * * 2,5"

permissions:
  contents: write

concurrency:
  group: pub-corpus-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded parser dependency
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Ingest candidate queue
        run: python pub-corpus/scripts/ingest_candidates.py

      - name: Commit newly admitted artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- pub-corpus/corpus pub-corpus/data/manifest.jsonl)" ]]; then
            echo "No novel admitted PUB artifacts."
            exit 0
          fi

          git config user.name "lalamu-corpus-bot"
          git config user.email "lalamu-corpus-bot@users.noreply.github.com"

          git add -- pub-corpus/corpus pub-corpus/data/manifest.jsonl
          git commit -m "corpus: ingest validated novel PUB candidates"
          git push
