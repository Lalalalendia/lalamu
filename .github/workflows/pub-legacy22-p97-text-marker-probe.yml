name: PUB legacy22 Publisher97 text-marker probe

on:
  push:
    branches:
      - research/legacy22-noquill-corpus-probe-20260929
    paths:
      - ".github/workflows/pub-legacy22-p97-text-marker-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pub-legacy22-p97-marker-${{ github.ref }}
  cancel-in-progress: true

env:
  RAR_REF: aa2df26384fe6fe29e88dcd0ee9fdda908d4c82a
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar-target

jobs:
  marker-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: HeisLuka/rar
          ref: ${{ env.RAR_REF }}
          path: rar-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Install pinned generic CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Apply one-variable Publisher97 text-marker variant
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("rar-src/vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs")
          s=p.read_text()
          old="const LEGACY_TEXT_SHAPE_TYPE: u16 = 0x0008;"
          new="const LEGACY_TEXT_SHAPE_TYPE: u16 = 0x0000;"
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new))
          PY
          git -C rar-src diff --check
          git -C rar-src diff -- vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs

      - name: Build exact one-variable Reader variant
        run: |
          set -euo pipefail
          cargo build             --manifest-path rar-src/vendor/producer-a/Cargo.toml             -p pub-viewer             --release             --bin corpus-reader-receipt

      - name: Replay all 625 materialized PUB
        run: |
          set -euo pipefail
          rm -rf pub-corpus/data/legacy22-p97-text-marker-profile
          python pub-corpus/scripts/deep_profile.py             --corpus-root pub-corpus             --rar-tools rar-src/tools/corpus             --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt"             --rar-ref "${RAR_REF}+text-marker-0000"             --out pub-corpus/data/legacy22-p97-text-marker-profile             --workers 4

      - name: Compare with exact #1311 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          before=json.loads(Path("pub-corpus/data/legacy22-candidate-profile/reader-records.json").read_text())
          after=json.loads(Path("pub-corpus/data/legacy22-p97-text-marker-profile/reader-records.json").read_text())
          b={r["source_sha256"]:r for r in before}
          a={r["source_sha256"]:r for r in after}
          assert set(a)==set(b) and len(a)==625

          old=[r for r in after if r.get("contents_family")=="0x22"]
          opened=[r for r in old if r.get("opened") is True]
          baseline_old=[r for r in before if r.get("contents_family")=="0x22" and r.get("opened") is True]

          result={
            "schema":"lalamu.legacy22-p97-text-marker-probe.v1",
            "base_candidate_rar_ref":"aa2df26384fe6fe29e88dcd0ee9fdda908d4c82a",
            "single_change":"LEGACY_TEXT_SHAPE_TYPE 0x0008 -> 0x0000",
            "old_open_before":len(baseline_old),
            "old_open_after":len(opened),
            "old_open_delta":len(opened)-len(baseline_old),
            "old_opened_with_scene_nodes_before":sum(1 for r in baseline_old if (r.get("scene_node_count") or 0)>0),
            "old_opened_with_scene_nodes_after":sum(1 for r in opened if (r.get("scene_node_count") or 0)>0),
            "old_opened_with_story_frames_before":sum(1 for r in baseline_old if (r.get("story_frame_count") or 0)>0),
            "old_opened_with_story_frames_after":sum(1 for r in opened if (r.get("story_frame_count") or 0)>0),
            "old_opened_with_text_fragments_before":sum(1 for r in baseline_old if (r.get("text_fragment_count") or 0)>0),
            "old_opened_with_text_fragments_after":sum(1 for r in opened if (r.get("text_fragment_count") or 0)>0),
            "old_scene_node_total_after":sum(r.get("scene_node_count") or 0 for r in opened),
            "old_story_frame_total_after":sum(r.get("story_frame_count") or 0 for r in opened),
            "old_text_fragment_total_after":sum(r.get("text_fragment_count") or 0 for r in opened),
            "old_story_total_after":sum(r.get("story_count") or 0 for r in opened),
            "mature_open_before":sum(1 for r in before if r.get("contents_family")=="0x2c" and r.get("opened") is True),
            "mature_open_after":sum(1 for r in after if r.get("contents_family")=="0x2c" and r.get("opened") is True),
            "changed_open_state_count":sum(1 for sha in a if bool(a[sha].get("opened")) != bool(b[sha].get("opened"))),
          }
          Path("pub-corpus/data/legacy22-p97-text-marker-profile/text-marker-delta.json").write_text(
            json.dumps(result,indent=2,ensure_ascii=False)+"\n"
          )
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Publish source-safe variant result
        shell: bash
        run: |
          set -euo pipefail
          test -s pub-corpus/data/legacy22-p97-text-marker-profile/text-marker-delta.json
          if find pub-corpus/data/legacy22-p97-text-marker-profile -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked" >&2
            exit 1
          fi
          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add -- pub-corpus/data/legacy22-p97-text-marker-profile
          git commit -m "lab: prove Publisher97 no-Quill text-marker discriminator"
          git push origin HEAD:"${GITHUB_REF_NAME}"
