name: devhelp-topic-surface-proof

on:
  push:
    branches:
      - devhelp-xver-01-clean-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devhelp-xver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source-safe parsers
        run: |
          python -m py_compile             tools/devhelp_topic_surface.py             tools/devhelp_chm_normalize.py             tests/test_devhelp_topic_surface.py             tests/test_devhelp_chm_normalize.py
          python -m unittest discover -s tests -p 'test_devhelp*.py' -v

      - name: Validate retained topic-directory result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          r = json.loads(Path("research/devhelp-xver-01/topic-surface-diff.json").read_text(encoding="utf-8"))
          assert r["source_2002"]["byte_len"] == 656752
          assert r["source_2002"]["sha256"] == "688a5a4c5ec209740ba2506e322fc9c8070747c0d9cc7b59560e0a0bea2acf51"
          assert r["source_2003"]["byte_len"] == 1180470
          assert r["source_2003"]["sha256"] == "796e0a899e5b691d04895590206113f112816fe161250486b787f82af4ac5418"
          assert r["diff"]["added_count"] == 207
          assert r["diff"]["removed_count"] == 7
          assert r["evidence_boundary"]["pub_wire_format_claims_allowed"] is False
          PY

      - name: Install read-only CHM extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y libchm-bin

      - name: Acquire exact pinned public Actions artifacts
        run: |
          set -euxo pipefail
          mkdir -p /tmp/devhelp/p2002 /tmp/devhelp/p2003
          curl -fL             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/HeisLuka/rar/actions/artifacts/10802143151/zip"             -o /tmp/devhelp/p2002.zip
          curl -fL             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "https://api.github.com/repos/HeisLuka/rar/actions/artifacts/10809962912/zip"             -o /tmp/devhelp/p2003.zip
          unzip -q /tmp/devhelp/p2002.zip -d /tmp/devhelp/p2002
          unzip -q /tmp/devhelp/p2003.zip -d /tmp/devhelp/p2003

          test "$(stat -c %s /tmp/devhelp/p2002/VBAPB10-P2002-1033.CHM)" = "656752"
          test "$(sha256sum /tmp/devhelp/p2002/VBAPB10-P2002-1033.CHM | awk '{print $1}')" =             "688a5a4c5ec209740ba2506e322fc9c8070747c0d9cc7b59560e0a0bea2acf51"
          test "$(stat -c %s /tmp/devhelp/p2003/VBAPB10-P2003-1033.CHM)" = "1180470"
          test "$(sha256sum /tmp/devhelp/p2003/VBAPB10-P2003-1033.CHM | awk '{print $1}')" =             "796e0a899e5b691d04895590206113f112816fe161250486b787f82af4ac5418"

      - name: Extract CHM offline
        run: |
          set -euxo pipefail
          mkdir -p /tmp/devhelp/extracted-2002 /tmp/devhelp/extracted-2003
          extract_chmLib             /tmp/devhelp/p2002/VBAPB10-P2002-1033.CHM             /tmp/devhelp/extracted-2002             >/tmp/devhelp/extract-2002.log
          extract_chmLib             /tmp/devhelp/p2003/VBAPB10-P2003-1033.CHM             /tmp/devhelp/extracted-2003             >/tmp/devhelp/extract-2003.log
          test "$(find /tmp/devhelp/extracted-2002 -type f -iname 'pb*.htm' | wc -l)" -gt 600
          test "$(find /tmp/devhelp/extracted-2003 -type f -iname 'pb*.htm' | wc -l)" -gt 800

      - name: Normalize object-model help and build cross-version diff
        run: |
          python tools/devhelp_chm_normalize.py             --p2002-root /tmp/devhelp/extracted-2002             --p2002-chm /tmp/devhelp/p2002/VBAPB10-P2002-1033.CHM             --p2003-root /tmp/devhelp/extracted-2003             --p2003-chm /tmp/devhelp/p2003/VBAPB10-P2003-1033.CHM             --out /tmp/devhelp/devhelp-xver-normalized.json

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("/tmp/devhelp/devhelp-xver-normalized.json")
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["schema_version"] == "chaptera.devhelp-xver.normalized.v1"
          assert r["source_2002"]["chm_sha256"] == "688a5a4c5ec209740ba2506e322fc9c8070747c0d9cc7b59560e0a0bea2acf51"
          assert r["source_2003"]["chm_sha256"] == "796e0a899e5b691d04895590206113f112816fe161250486b787f82af4ac5418"
          assert len(r["added_topic_ids"]) == 207
          assert len(r["removed_topic_ids"]) == 7
          assert r["evidence_boundary"]["topic_body_text_retained"] is False
          assert r["evidence_boundary"]["topic_body_structure_extracted"] is True
          assert r["evidence_boundary"]["pub_wire_format_claims_allowed"] is False

          for version in ("source_2002", "source_2003"):
              coverage = r[version]["coverage"]
              assert coverage.get("links", 0) > 0
              assert coverage.get("syntax", 0) > 0
              assert coverage.get("parameters", 0) > 0

          summary = {
              "p2002_topics": r["source_2002"]["topic_count"],
              "p2003_topics": r["source_2003"]["topic_count"],
              "added": len(r["added_topic_ids"]),
              "removed": len(r["removed_topic_ids"]),
              "coverage_2002": r["source_2002"]["coverage"],
              "coverage_2003": r["source_2003"]["coverage"],
              "changed_common_counts": {
                  key: len(value)
                  for key, value in r["changed_common_topic_ids"].items()
              },
          }
          Path("/tmp/devhelp/devhelp-xver-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload normalized evidence only
        uses: actions/upload-artifact@v4
        with:
          name: devhelp-xver-normalized
          path: |
            /tmp/devhelp/devhelp-xver-normalized.json
            /tmp/devhelp/devhelp-xver-summary.json
          if-no-files-found: error
          retention-days: 14
