name: devhelp-topic-surface-proof

on:
  push:
    branches:
      - devhelp-xver-01-clean-v1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  devhelp-xver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependency
        run: python -m pip install beautifulsoup4==4.12.3

      - name: Validate source-safe parsers
        run: |
          python -m py_compile             tools/devhelp_topic_surface.py             tools/devhelp_chm_normalize.py             tests/test_devhelp_topic_surface.py             tests/test_devhelp_chm_normalize.py
          python -m unittest discover -s tests -p 'test_devhelp*.py' -v

      - name: Validate retained topic-directory result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("research/devhelp-xver-01/topic-surface-diff.json").read_text(encoding="utf-8"))
          assert r["source_2002"]["byte_len"] == 656752
          assert r["source_2002"]["sha256"] == "688a5a4c5ec209740ba2506e322fc9c8070747c0d9cc7b59560e0a0bea2acf51"
          assert r["source_2003"]["byte_len"] == 1180470
          assert r["source_2003"]["sha256"] == "796e0a899e5b691d04895590206113f112816fe161250486b787f82af4ac5418"
          assert r["diff"]["added_count"] == 207
          assert r["diff"]["removed_count"] == 7
          assert r["evidence_boundary"]["pub_wire_format_claims_allowed"] is False
          PY

      - name: Install read-only CHM extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y libchm-bin

      - name: Stage extractor runtime
        run: |
          set -euxo pipefail
          mkdir -p /tmp/chm-extractor-runtime/lib
          cp /usr/bin/extract_chmLib /tmp/chm-extractor-runtime/
          CHM_LIB="$(ldd /usr/bin/extract_chmLib | awk '/libchm\.so/{print $3; exit}')"
          test -n "$CHM_LIB"
          cp -L "$CHM_LIB" /tmp/chm-extractor-runtime/lib/libchm.so.1
          printf '%s\n' '#!/usr/bin/env bash'             'set -euo pipefail'             'ROOT="$(cd "$(dirname "$0")" && pwd)"'             'export LD_LIBRARY_PATH="$ROOT/lib:${LD_LIBRARY_PATH:-}"'             'exec "$ROOT/extract_chmLib" "$@"'             > /tmp/chm-extractor-runtime/run-extract.sh
          chmod +x /tmp/chm-extractor-runtime/run-extract.sh
          sha256sum             /tmp/chm-extractor-runtime/extract_chmLib             /tmp/chm-extractor-runtime/lib/libchm.so.1             > /tmp/chm-extractor-runtime/SHA256SUMS

      - name: Upload extractor runtime
        uses: actions/upload-artifact@v4
        with:
          name: chm-extractor-runtime
          path: /tmp/chm-extractor-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Validate retained body-structure diff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("research/devhelp-xver-01/body-structure-diff.json")
          if not p.exists():
              print("body-structure diff not committed yet")
              raise SystemExit(0)
          r = json.loads(p.read_text(encoding="utf-8"))
          assert r["schema_version"] == "chaptera.devhelp-xver.body-structure-diff.v1"
          assert r["sources"]["p2002"]["chm_sha256"] == "688a5a4c5ec209740ba2506e322fc9c8070747c0d9cc7b59560e0a0bea2acf51"
          assert r["sources"]["p2003"]["chm_sha256"] == "796e0a899e5b691d04895590206113f112816fe161250486b787f82af4ac5418"
          assert r["sources"]["p2002"]["topic_count"] == 692
          assert r["sources"]["p2003"]["topic_count"] == 892
          assert r["surface"]["common_count"] == 685
          assert r["surface"]["added_count"] == 207
          assert r["surface"]["removed_count"] == 7
          assert len(r["signature_changes"]) == 8
          assert len(r["argument_changes"]) == 8
          assert len(r["enum_group_changes"]) == 8
          assert len(r["rename_move_candidates"]) == 3
          assert r["evidence_boundary"]["full_help_prose_committed"] is False
          assert r["evidence_boundary"]["pub_wire_format_claims_allowed"] is False
          print(json.dumps({
              "signature_changes": [row["topic_id"] for row in r["signature_changes"]],
              "argument_changes": [row["topic_id"] for row in r["argument_changes"]],
              "enum_group_changes": [row["topic_id"] for row in r["enum_group_changes"]],
              "rename_move_candidates": [
                  [row["from"], row["to"]]
                  for row in r["rename_move_candidates"]
              ],
          }, sort_keys=True))
          PY
