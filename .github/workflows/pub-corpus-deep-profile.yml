name: PUB corpus deep profile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - research/pub-corpus-deep-profile-399-20260929
    paths:
      - "pub-corpus/corpus/**/*.pub"
      - "pub-corpus/data/manifest.jsonl"
      - "pub-corpus/data/rar-cc-rehydrate/rehydrated-manifest.json"
      - "pub-corpus/scripts/deep_profile.py"
      - ".github/workflows/pub-corpus-deep-profile.yml"

permissions:
  contents: write

concurrency:
  group: pub-corpus-deep-profile-${{ github.ref }}
  cancel-in-progress: false

env:
  RAR_REF: 57c8106bfbb43ae645cf4ea35762c87ebd0a55a8
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar-target

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout working corpus
        uses: actions/checkout@v4

      - name: Checkout pinned Rar analysis + Reader receipt
        uses: actions/checkout@v4
        with:
          repository: HeisLuka/rar
          ref: ${{ env.RAR_REF }}
          path: rar-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install pinned generic CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build current source-free Chaptera Reader receipt
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path rar-src/vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-receipt

      - name: Deep-profile materialized PUB corpus
        run: |
          set -euo pipefail
          python -m py_compile pub-corpus/scripts/deep_profile.py
          rm -rf pub-corpus/data/deep-profile
          python pub-corpus/scripts/deep_profile.py \
            --corpus-root pub-corpus \
            --rar-tools rar-src/tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "${RAR_REF}" \
            --out pub-corpus/data/deep-profile \
            --workers 4

      - name: Guard retained output
        run: |
          set -euo pipefail
          test -s pub-corpus/data/deep-profile/summary.json
          test -s pub-corpus/data/deep-profile/shortlist.json
          test -s pub-corpus/data/deep-profile/fingerprints.json
          test -s pub-corpus/data/deep-profile/reader-summary.json
          if find pub-corpus/data/deep-profile -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into deep-profile output" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("pub-corpus/data/deep-profile/summary.json").read_text())
          assert s["corpus_file_count"] >= 300, s
          assert s["structural_probe_error_count"] == 0, s
          assert s["reader"]["input_file_count"] == s["corpus_file_count"], s
          print(json.dumps({
              "corpus": s["corpus_file_count"],
              "families": s["contents_family_physical_counts"],
              "logical": s["logical_identity_count"],
              "structural_clusters": s["structural_cluster_count"],
              "singletons": s["structural_singleton_count"],
              "reader_opened": s["reader"]["opened_count"],
              "reader_failed": s["reader"]["failed_count"],
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pub-corpus-deep-profile-${{ github.run_id }}
          path: pub-corpus/data/deep-profile/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish deterministic profile
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- pub-corpus/data/deep-profile)" ]]; then
            echo "Deep profile unchanged."
            exit 0
          fi
          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add -- pub-corpus/data/deep-profile
          git commit -m "lab: refresh Rar-backed PUB corpus deep profile"
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push raced on attempt ${attempt}; retrying."
          done
          exit 1
