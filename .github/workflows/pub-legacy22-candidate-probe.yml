name: PUB legacy22 candidate corpus probe

on:
  push:
    branches:
      - research/legacy22-noquill-corpus-probe-20260929
    paths:
      - ".github/workflows/pub-legacy22-candidate-probe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pub-legacy22-candidate-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  RAR_REF: aa2df26384fe6fe29e88dcd0ee9fdda908d4c82a
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar-target

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout strict working corpus
        uses: actions/checkout@v4

      - name: Checkout exact legacy22 candidate
        uses: actions/checkout@v4
        with:
          repository: HeisLuka/rar
          ref: ${{ env.RAR_REF }}
          path: rar-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install pinned generic CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build exact candidate Reader receipt
        run: |
          set -euo pipefail
          cargo build             --manifest-path rar-src/vendor/producer-a/Cargo.toml             -p pub-viewer             --release             --bin corpus-reader-receipt

      - name: Probe all 625 materialized PUB
        run: |
          set -euo pipefail
          rm -rf pub-corpus/data/legacy22-candidate-profile
          python pub-corpus/scripts/deep_profile.py             --corpus-root pub-corpus             --rar-tools rar-src/tools/corpus             --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt"             --rar-ref "${RAR_REF}"             --out pub-corpus/data/legacy22-candidate-profile             --workers 4

      - name: Compare candidate against current baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          current=json.loads(Path("pub-corpus/data/deep-profile/reader-summary.json").read_text())
          cand=json.loads(Path("pub-corpus/data/legacy22-candidate-profile/reader-summary.json").read_text())

          families=sorted(set(current.get("opened_by_family",{})) | set(current.get("failed_by_family",{})) |
                          set(cand.get("opened_by_family",{})) | set(cand.get("failed_by_family",{})))
          delta={}
          for fam in families:
              before_open=current.get("opened_by_family",{}).get(fam,0)
              after_open=cand.get("opened_by_family",{}).get(fam,0)
              before_fail=current.get("failed_by_family",{}).get(fam,0)
              after_fail=cand.get("failed_by_family",{}).get(fam,0)
              delta[fam]={
                  "opened_before": before_open,
                  "opened_after": after_open,
                  "opened_delta": after_open-before_open,
                  "failed_before": before_fail,
                  "failed_after": after_fail,
                  "failed_delta": after_fail-before_fail,
              }

          out={
              "schema":"lalamu.legacy22-candidate-corpus-probe.v1",
              "candidate_rar_ref":"aa2df26384fe6fe29e88dcd0ee9fdda908d4c82a",
              "input_file_count":cand["input_file_count"],
              "opened_before":current["opened_count"],
              "opened_after":cand["opened_count"],
              "opened_delta":cand["opened_count"]-current["opened_count"],
              "failed_before":current["failed_count"],
              "failed_after":cand["failed_count"],
              "failed_delta":cand["failed_count"]-current["failed_count"],
              "by_family":delta,
              "candidate_failure_signature_count":cand["failure_signature_count"],
              "candidate_failure_signature_groups":cand["failure_signature_groups"],
              "candidate_diagnostic_code_counts":cand.get("diagnostic_code_counts",{}),
          }
          p=Path("pub-corpus/data/legacy22-candidate-profile/candidate-delta.json")
          p.write_text(json.dumps(out,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY

      - name: Guard retained result
        run: |
          set -euo pipefail
          test -s pub-corpus/data/legacy22-candidate-profile/candidate-delta.json
          if find pub-corpus/data/legacy22-candidate-profile -type f -iname '*.pub' | grep -q .; then
            echo "raw PUB leaked into candidate profile" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pub-legacy22-candidate-probe-${{ github.run_id }}
          path: pub-corpus/data/legacy22-candidate-profile/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add -- pub-corpus/data/legacy22-candidate-profile
          if git diff --cached --quiet; then
            echo "No candidate evidence changes."
            exit 0
          fi
          git commit -m "lab: profile legacy22 no-Quill candidate against 625 corpus"
          git push origin HEAD:"${GITHUB_REF_NAME}"
