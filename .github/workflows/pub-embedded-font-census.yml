name: PUB embedded-font census

on:
  push:
    branches:
      - research/pub-embedded-font-census-20260929
    paths:
      - "pub-corpus/scripts/embedded_font_census.py"
      - ".github/workflows/pub-embedded-font-census.yml"
      - "pub-corpus/corpus/**/*.pub"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libmspub tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmspub-tools
          command -v pub2raw
          pub2raw --version
          dpkg-query -W -f='libmspub-tools ${Version}\n' libmspub-tools

      - name: Validate probe on known EOT-positive public control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eot-control
          curl -L --fail --retry 3 \
            -o /tmp/eot-control/fonts.pub \
            https://raw.githubusercontent.com/fosnola/libmspub-test/master/testset/12.0/fonts.pub
          echo "8d50872a7d8ee6130b889efbe99275ee333747bc7777f3c5256a05f2c6d32048  /tmp/eot-control/fonts.pub" | sha256sum -c -
          mkdir -p pub-corpus/data/embedded-font-census
          pub2raw /tmp/eot-control/fonts.pub > pub-corpus/data/embedded-font-census/control-pub2raw.txt
          grep -inE 'defineEmbeddedFont|ms-fontobject|office:binary-data|librevenge:name' \
            pub-corpus/data/embedded-font-census/control-pub2raw.txt \
            > pub-corpus/data/embedded-font-census/control-marker-lines.txt || true
          python pub-corpus/scripts/embedded_font_census.py \
            --corpus /tmp/eot-control \
            --output pub-corpus/data/embedded-font-census/control.json \
            --raw-dir pub-corpus/data/embedded-font-census/control-raw
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("pub-corpus/data/embedded-font-census/control.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          print(json.dumps({
              "control_embedded_font_file_count": d["embedded_font_file_count"],
              "control_records": d["records"],
          }, indent=2, sort_keys=True))
          if d["embedded_font_file_count"] != 1:
              raise SystemExit("Known EOT-positive control was not detected; probe marker grammar needs correction")
          PY

      - name: Run embedded-font census
        shell: bash
        run: |
          set -euo pipefail
          python pub-corpus/scripts/embedded_font_census.py
          python -m py_compile pub-corpus/scripts/embedded_font_census.py

      - name: Show result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("pub-corpus/data/embedded-font-census/latest.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          summary = {
              "corpus_file_count": d["corpus_file_count"],
              "libmspub_supported_count": d["libmspub_supported_count"],
              "libmspub_unsupported_or_error_count": d["libmspub_unsupported_or_error_count"],
              "embedded_font_file_count": d["embedded_font_file_count"],
              "embedded_font_record_marker_count": d["embedded_font_record_marker_count"],
              "hit_sha256": d["hit_sha256"],
              "pub2raw_version": d["pub2raw_version"],
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open(Path.home() / "summary.md", "w", encoding="utf-8") as f:
              f.write("# PUB embedded-font census\n\n")
              for k, v in summary.items():
                  f.write(f"- **{k}:** `{v}`\n")
          PY
          cat "$HOME/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-embedded-font-census
          path: pub-corpus/data/embedded-font-census/
          if-no-files-found: error
          retention-days: 14


      - name: Publish census receipt on research branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add -- pub-corpus/data/embedded-font-census
          if git diff --cached --quiet; then
            echo "No census changes."
            exit 0
          fi
          git commit -m "lab: publish PUB embedded-font census receipt"
          git push origin HEAD:research/pub-embedded-font-census-20260929
