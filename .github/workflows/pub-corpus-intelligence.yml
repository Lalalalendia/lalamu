name: PUB corpus intelligence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pub-corpus/corpus/**/*.pub"
      - "pub-corpus/data/manifest.jsonl"
      - "pub-corpus/scripts/corpus_intelligence.py"
      - ".github/workflows/pub-corpus-intelligence.yml"

permissions:
  contents: write

concurrency:
  group: pub-corpus-intelligence
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded CFB dependency
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build structural intelligence receipt
        run: |
          set -euo pipefail
          python pub-corpus/scripts/corpus_intelligence.py
          python -m py_compile pub-corpus/scripts/corpus_intelligence.py

      - name: Upload intelligence receipt
        uses: actions/upload-artifact@v4
        with:
          name: pub-corpus-intelligence-v1
          path: |
            pub-corpus/data/intelligence/latest.json
            pub-corpus/data/intelligence/records.jsonl
          if-no-files-found: error

      - name: Publish changed intelligence
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- pub-corpus/data/intelligence)" ]]; then
            echo "Intelligence receipt unchanged."
            exit 0
          fi

          git config user.name "lalamu-lab-bot"
          git config user.email "lalamu-lab-bot@users.noreply.github.com"
          git add -- pub-corpus/data/intelligence
          git commit -m "lab: refresh PUB corpus intelligence"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with main on attempt ${attempt}; retrying."
          done
          exit 1
